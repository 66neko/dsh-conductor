[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-conductor"
dynamic = ["version"]
description = "DSH-managed coding-agent delegation with independent verification"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yu", email = "66neko@users.noreply.github.com" }]
keywords = ["dsh", "deepseek", "tmux", "claude-code", "codex", "orchestration", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/66neko/dsh-conductor"
Repository = "https://github.com/66neko/dsh-conductor"
Issues = "https://github.com/66neko/dsh-conductor/issues"

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.setuptools.dynamic]
version = {attr = "conductor._version.__version__"}

[tool.setuptools.data-files]
"share/dsh-conductor/skills/tmux-claude-code" = ["skills/tmux-claude-code/SKILL.md"]
"share/dsh-conductor/skills/tmux-claude-code/scripts" = ["skills/tmux-claude-code/scripts/*.py"]
"share/dsh-conductor/skills/tmux-codex" = ["skills/tmux-codex/SKILL.md"]
"share/dsh-conductor/skills/tmux-codex/scripts" = ["skills/tmux-codex/scripts/*.py"]
