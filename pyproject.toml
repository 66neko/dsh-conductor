[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-conductor"
version = "0.2.0"
description = "DSH-managed coding-agent delegation with independent verification"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[project.scripts]
conductor = "conductor.cli:main"

[tool.setuptools.packages.find]
include = ["conductor*"]
