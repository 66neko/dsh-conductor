name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: 要构建并发布的版本标签，格式为 v<project-version>
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: 构建并验证发行包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 校验版本标签与项目版本
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.git_ref }}
        run: |
          PROJECT_VERSION=$(python -c 'from conductor._version import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$PROJECT_VERSION" || {
            echo "Release tag ($RELEASE_TAG) must equal v$PROJECT_VERSION" >&2
            exit 1
          }
      - name: 安装构建工具
        run: python -m pip install --upgrade pip build twine check-wheel-contents
      - name: 安装 tmux 集成测试依赖
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: 运行测试
        run: python -m unittest discover -v
      - name: 编译检查
        run: python -m compileall -q conductor skills tests examples
      - name: 构建 wheel 与 sdist
        run: python -m build --sdist --wheel
      - name: 检查发行包元数据
        run: python -m twine check dist/*
      - name: 检查 wheel 内容
        run: python -m check_wheel_contents dist/*.whl
      - name: 验证 wheel 安装后的 skill
        run: |
          TEST_ENV="$RUNNER_TEMP/dsh-conductor-wheel-env"
          python -m venv "$TEST_ENV"
          "$TEST_ENV/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$TEST_ENV/bin/python" - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from conductor import activity
          from conductor.agents.claude import CLAUDE
          from conductor.agents.codex import CODEX
          from conductor.models import AgentKind
          from conductor.skills import prepare_workspace_skills, source_skill
          from conductor.supervision import Supervisor

          with TemporaryDirectory() as directory:
              root = prepare_workspace_skills(Path(directory))
              for kind in AgentKind:
                  assert (source_skill(kind) / "SKILL.md").is_file()
                  assert (root / kind.skill_name / "SKILL.md").is_file()
                  assert (root / kind.skill_name / "scripts" / kind.script_name).is_file()
          PY
      - name: 保存发行包
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dsh-conductor
    permissions:
      id-token: write
    steps:
      - name: 下载已验证的发行包
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: 发布到 PyPI（Trusted Publishing）
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
