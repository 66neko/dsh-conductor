name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dsh-conductor
    permissions:
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 构建发布包
        run: python -m pip install build twine && python -m build
      - name: 检查发布包
        run: python -m twine check dist/*
      - name: 使用 Trusted Publishing 发布到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
